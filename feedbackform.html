<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>

<body>

    <h3>Movie Feedback Form</h3>

    <form action="#" method="get">

        <label>Name</label><br>
        <input type="text" name="name" value="Esanagiri Reethika" required>
        <br><br>

        <label>Email</label><br>
        <input type="email" name="email" value="reethika9014gmail.com" required>
        <br><br>

        <label>Movie Name</label><br>
        <input type="text" name="movie" required>
        <br><br>

        <label>Rating</label><br>
        <input type="radio" name="rating" value="1"> 1
        <input type="radio" name="rating" value="2"> 2
        <input type="radio" name="rating" value="3"> 3
        <input type="radio" name="rating" value="4"> 4
        <input type="radio" name="rating" value="5"> 5
        <br><br>

        <label>Feedback</label><br>
        <textarea name="feedback" rows="5" cols="30" required></textarea>
        <br><br>

        <label>Would you recommend this movie?</label><br>
        <input type="radio" name="recommend" value="Yes"> Yes
        <input type="radio" name="recommend" value="No"> No
        <br><br>

        <input type="submit" value="Submit Feedback">
        <input type="reset" value="Reset">

    </form>

</body>

</html>
